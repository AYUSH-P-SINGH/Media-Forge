apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mediaforge.fullname" . }}-secrets
  labels:
    {{- include "mediaforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: "{{ .Values.postgresql.user }}"
  POSTGRES_PASSWORD: "{{ .Values.postgresql.password }}"
  DATABASE_URL: "postgresql://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ include "mediaforge.fullname" . }}-db:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
