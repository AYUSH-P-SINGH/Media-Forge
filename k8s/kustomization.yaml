apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediaforge

labels:
  - pairs:
      app.kubernetes.io/part-of: mediaforge-platform
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - db-service.yaml
  - db-deployment.yaml
  - app-service.yaml
  - app-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml
