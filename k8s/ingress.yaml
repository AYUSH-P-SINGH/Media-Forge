apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediaforge-ingress
  namespace: mediaforge
  labels:
    app.kubernetes.io/name: mediaforge
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: mediaforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mediaforge-app
                port:
                  number: 5000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mediaforge-app
                port:
                  number: 5000
