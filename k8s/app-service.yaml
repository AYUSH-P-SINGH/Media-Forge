apiVersion: v1
kind: Service
metadata:
  name: mediaforge-app
  namespace: mediaforge
  labels:
    app.kubernetes.io/name: mediaforge
    app.kubernetes.io/component: app
spec:
  type: NodePort
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30500
      protocol: TCP
  selector:
    app.kubernetes.io/name: mediaforge
    app.kubernetes.io/component: app
