apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediaforge-db-netpol
  namespace: mediaforge
  labels:
    app.kubernetes.io/name: mediaforge
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mediaforge
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming connections to Postgres ONLY from mediaforge-app pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mediaforge
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mediaforge-app-netpol
  namespace: mediaforge
  labels:
    app.kubernetes.io/name: mediaforge
    app.kubernetes.io/component: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mediaforge
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to port 5000
    - ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow egress to Postgres DB
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mediaforge
              app.kubernetes.io/component: database
      ports:
        - protocol: TCP
          port: 5432
    # Allow DNS resolution within cluster
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
