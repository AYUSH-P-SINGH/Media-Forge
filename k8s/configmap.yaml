apiVersion: v1
kind: ConfigMap
metadata:
  name: mediaforge-config
  namespace: mediaforge
  labels:
    app.kubernetes.io/name: mediaforge
    app.kubernetes.io/component: backend
data:
  PORT: "5000"
  NODE_ENV: "production"
  STORAGE_DIR: "/app/uploads"
  MAX_FILE_SIZE_MB: "50"
  ALLOWED_MIME_TYPES: "video/mp4,video/webm,video/quicktime,audio/mpeg,audio/wav,audio/aac,image/jpeg,image/png,image/webp,application/pdf"
  ENABLE_MOCK_PROCESSING: "true"
  PROCESSING_DELAY_MS: "2000"
  POSTGRES_DB: "mediaforge"
  POSTGRES_HOST: "mediaforge-db"
  POSTGRES_PORT: "5432"
