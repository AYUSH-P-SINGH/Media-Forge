services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediaforge-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://mediaforge:mediaforge123@db:5432/mediaforge
      - STORAGE_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=50
      - ENABLE_MOCK_PROCESSING=false
      - PROCESSING_DELAY_MS=1000
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=mediaforge
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - media_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  db:
    image: postgres:16-alpine
    container_name: mediaforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediaforge
      POSTGRES_PASSWORD: mediaforge123
      POSTGRES_DB: mediaforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaforge -d mediaforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: mediaforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  media_uploads:
    name: mediaforge_uploads
  postgres_data:
    name: mediaforge_postgres_data
  minio_data:
    name: mediaforge_minio_data